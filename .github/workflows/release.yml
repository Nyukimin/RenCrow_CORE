name: Create Tag and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (required, e.g. v0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create as draft"
        required: false
        type: boolean
        default: false

jobs:
  regression:
    uses: ./.github/workflows/go-test.yml
    secrets:
      RENCROW_TOOLS_READ_TOKEN: ${{ secrets.RENCROW_TOOLS_READ_TOKEN }}

  create-tag:
    needs: regression
    name: Create Git Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

  release:
    name: GoReleaser Release
    needs: create-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GOCACHE: ${{ github.workspace }}/Tmp/test-runtime/_cache/go-build
      GOMODCACHE: ${{ github.workspace }}/Tmp/test-runtime/_cache/go-mod
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download private Go module dependencies
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RENCROW_TOOLS_READ_TOKEN }}
          GOPRIVATE: github.com/Nyukimin/RenCrow_Tools/tools/research/research_engine
          GOMODCACHE: ${{ github.workspace }}/Tmp/test-runtime/_cache/go-mod
          GIT_TERMINAL_PROMPT: '0'
        run: |
          $bootstrapRoot = Join-Path $PWD 'Tmp/test-runtime/_bootstrap'
          New-Item -ItemType Directory -Force -Path $bootstrapRoot -ErrorAction Stop | Out-Null
          $env:GIT_CONFIG_GLOBAL = Join-Path $bootstrapRoot 'private-go.gitconfig'
          try {
            gh auth setup-git --hostname github.com
            if ($LASTEXITCODE -ne 0) { throw 'GitHub credential helper setup failed' }
            go mod download
            if ($LASTEXITCODE -ne 0) { throw 'Go module download failed' }
          }
          finally {
            if (Test-Path -LiteralPath $env:GIT_CONFIG_GLOBAL) {
              Remove-Item -LiteralPath $env:GIT_CONFIG_GLOBAL -Force -ErrorAction Stop
            }
            if (Test-Path -LiteralPath $env:GIT_CONFIG_GLOBAL) { throw 'Temporary Git configuration cleanup failed' }
            Remove-Item Env:GIT_CONFIG_GLOBAL -ErrorAction SilentlyContinue
            Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY }}

      - name: Apply release flags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ inputs.tag }}" \
            --draft=${{ inputs.draft }} \
            --prerelease=${{ inputs.prerelease }}
