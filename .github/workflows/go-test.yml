name: Go Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  representative-tests:
    name: Representative Go tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Module contracts
        run: go test ./modules/...

      - name: Composition, features, Viewer adapter
        run: go test ./cmd/rencrow ./internal/features/... ./internal/adapter/viewer ./modules/...

  windows-build:
    name: Go build and vet (Windows)
    runs-on: windows-latest
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...
