name: build

on:
  push:
    branches: ["main"]
    # docs だけの変更はビルド結果に影響しない（docs/ は go:embed の対象外）。docs の公開規約は Public Docs Guard が検査する。
    paths-ignore:
      - 'docs/**'
      - '.public-docs-allowlist'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: fmt
        run: |
          make fmt
          git diff --exit-code || (echo "::error::Code is not formatted. Run 'make fmt' and commit the changes." && exit 1)

      - name: Build
        run: make build-all
