skill:
  id: "core.delivery-verification"
  name: "Delivery Verification"
  scope: "core"
  version: "1.0.0"
  description: "Verify delivery from canonical source through artifact, owner route, actual actor, visible result, and receipt."
  enabled: true
development_contract:
  required_capability: "delivery_evidence"
  required_tools:
    - "git"
    - "rg"
    - "go test"
  required_knowledge:
    - "requested acceptance criteria and terminal route"
    - "source, artifact, config, service, and process identity"
    - "authentication, policy, actual I/O, log, storage, and backup contracts"
  authority_requirement: "read-only verification; deploy, restart, and credential changes require separate scope"
  input_contract: "A delivered revision plus source/artifact/config/runtime/user-visible evidence requirements."
  output_contract: "A delivery receipt connecting source, artifact, owner, readiness, actual route I/O, visible result, logs, storage, and backup."
  cost_hint: "high"
  risk_level: "high"
  evaluation_method: "source-to-user evidence-chain and receipt contract checklist"
  version: "1.0.0"
triggers:
  keywords:
    - "delivery verification"
    - "配備後検証"
    - "運用成果確認"
  intents:
    - "delivery_verification"
    - "deployment_evidence"
