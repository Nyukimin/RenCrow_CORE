skill:
  id: "core.task-review"
  name: "Task Review"
  scope: "core"
  version: "1.0.0"
  description: "Review one task against its request, canonical specification, diff, tests, invariants, and terminal evidence."
  enabled: true
development_contract:
  required_capability: "change_review"
  required_tools:
    - "git"
    - "rg"
    - "go test"
  required_knowledge:
    - "original request and implementation plan"
    - "canonical specification and owner boundary"
    - "diff, tests, receipts, and unresolved evidence"
  authority_requirement: "review scope only; no merge, deploy, or execution authorization"
  input_contract: "An original request, bounded plan, complete diff, canonical refs, and available test/receipt evidence."
  output_contract: "A review matrix with findings, invariant checks, terminal evidence, verdict, and required actions."
  cost_hint: "medium"
  risk_level: "medium"
  evaluation_method: "adversarial finding classification and request-evidence matrix"
  version: "1.0.0"
triggers:
  keywords:
    - "task review"
    - "実装レビュー"
    - "差分レビュー"
  intents:
    - "task_review"
    - "implementation_review"
